name: Live relay probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Register with the live UltraViewer relay from CI
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Fetch 8bit.dat (binary asset, not stored in this repo)
        run: |
          curl -fL -o Sources/UltraViewerProtocol/Resources/8bit.dat "https://raw.githubusercontent.com/DeanOpen/MacViewer/f8d1b6529e673df3fe35fccdd4b65f7474e354b7/Sources/UltraViewerProtocol/Resources/8bit.dat"
          echo "9aa45789d9ff9d329a623a685d57b67e33c777019de9ce1f273f21860e4bfe6b  Sources/UltraViewerProtocol/Resources/8bit.dat" | shasum -a 256 -c -

      - name: Run live registration probe
        run: |
          set -o pipefail
          MACVIEWER_LIVE_PROBE=1 swift test --filter LiveRelayProbeTests 2>&1 | tee "$GITHUB_WORKSPACE/probe-log.txt"

      - name: Upload probe log (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$GITHUB_WORKSPACE/probe-log.txt" "probe-log-${{ github.run_number }}.txt" 2>/dev/null || echo "no log" > "probe-log-${{ github.run_number }}.txt"
          if gh release view ci-logs >/dev/null 2>&1; then
            gh release upload ci-logs "probe-log-${{ github.run_number }}.txt" --clobber
          else
            gh release create ci-logs "probe-log-${{ github.run_number }}.txt" --prerelease --title "CI build logs" --notes "Diagnostic build logs for the Ventura build."
          fi
